<div class="task-container">
  <h3>List of Tasks</h3>

  <div class="task-grid" >
    @for (task of tasks ; track task) {
      <div class="task-card" (click)="openTodo(task.id)">

        <div class="task-header">
          <h4>{{ task.name }}</h4>
        </div>

      </div>
    }@empty {
      <p>no tasks found</p>
    }
  </div>
</div>
